url: https://jemarnold.github.io/mnirs/
template:
  bootstrap: 5
  light-switch: false
  opengraph:
    twitter:
      creator: '@jem_arnold'
navbar:
  structure:
    left:
    - intro
    - articles
    - reference
    - news
    right:
    - search
    - github
    - bluesky
    - twitter
    - lightswitch
  components:
    github:
      icon: fa-github
      href: https://github.com/jemarnold/mnirs
      aria-label: GitHub
    bluesky:
      icon: fa-brands fa-bluesky
      href: https://bsky.app/profile/jemarnold.bsky.social
      aria-label: Bluesky
    twitter:
      icon: fa-twitter
      href: https://twitter.com/jem_arnold
      aria-label: Twitter
figures:
  bg: white
reference:
- title: Read data
  desc: |
    Read raw data from exported files.
  contents:
  - read_mnirs
  - example_mnirs
  - create_mnirs_data
- title: Process data
  desc: |
    Clean, filter, and transform data.
  contents:
  - resample_mnirs
  - starts_with("replace")
  - starts_with("filter")
  - shift_mnirs
  - rescale_mnirs
  - correct_blood_volume
- title: Detect intervals
  desc: |
    Detect and extract intervals for further analysis
  contents:
  - extract_intervals
  - starts_with("by_")
- title: Analyse kinetics
  desc: |
    Estimate response dynamics and kinetic parameters
  contents:
  - analyse_kinetics
  - matches("response_time")
  - matches("slope")
  - matches("monoexp")
  - matches("sigmoidal")
  - matches("logistic")
- title: Print & plot
  desc: |
    Tools for printing functions and pretty plotting with `{ggplot2}`.
  contents:
  - print.mnirs
  - print.mnirs_kinetics
  - plot.mnirs
  - theme_mnirs
  - starts_with("palette")
  - starts_with("scale")
  - breaks_timespan
  - format_hmmss
- title: Files
  desc: |
    Example data files included in the package
  contents:
  - ends_with("csv")
  - ends_with("xlsx")
